[package]
name = "meridian-sync"
version = "0.28.1"
edition = "2021"
description = "Keeps Meridian's git contexts in sync with their remotes"
license = "MIT"
publish = false

[[bin]]
name = "meridian-sync"
path = "src/main.rs"

[dependencies]
ignore = "0.4"
libc = "0.2"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
