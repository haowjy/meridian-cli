# Meridian configuration.
# All values shown are built-in defaults. Uncomment to override.
# Environment variables (MERIDIAN_*) take precedence over file values.

# -- Execution defaults -----------------------------------------------------
[defaults]
# Maximum agent nesting depth (int).
# max_depth = 3
# Retry attempts per failed spawn (int).
# max_retries = 3
# Delay multiplier between retries in seconds (float).
# retry_backoff_seconds = 0.25

# -- Timeout behavior -------------------------------------------------------
[timeouts]
# Grace period before force-killing processes (float minutes).
# kill_grace_minutes = 0.03333333333333333
# Max minutes to wait for guardrail checks (float minutes).
# guardrail_minutes = 0.5
# Max minutes to wait on run completion operations (float minutes).
# wait_minutes = 120.0

# -- Harness default models ------------------------------------------------
[harness]
# Default model for Claude harness (str model id).
# claude = ""  # empty = harness picks its own default model
# Default model for Codex harness (str model id).
# codex = ""  # empty = harness picks its own default model
# Default model for OpenCode harness (str model id).
opencode = "opencode-go/kimi-k2.6"  # default for OpenCode harness

# [harness.pi]
# Disable Meridian's Pi managed bash/background-tasks extension (bool).
# disable_managed_bash = false

# -- Primary agent defaults -------------------------------------------------
[primary]
# Context compaction threshold for the primary agent (int 1-100).
# autocompact = 65
# Model override for the primary agent (str model id).
# model = ""
# Harness override for the primary agent (str).
# harness = ""
# Agent profile name for the primary session (str; unset = no profile).
agent = "product-lead"

[spawn]
deny_headless_harnesses = ["claude"]

# -- Output streaming -------------------------------------------------------
[output]
# Event categories shown while streaming output (array[str]).
# show = ["lifecycle", "sub-run", "error", "system"]
# Output verbosity preset (str; valid: quiet, normal, verbose, debug).
# verbosity = "normal"  # example override; default is unset

# -- Context externalization -------------------------------------------------
# Work items stored in private repo, KB in public repo, strategy in shared docs
[context.work]
source = "git"
remote = "git@github.com:haowjy/meridian-cli-docs.git"
path = "work"
archive = "archive/meridian-cli/work"

[context.kb]
source = "git"
remote = "git@github.com:haowjy/meridian-cli-kb.git"
path = "kb"

[context.strategy]
source = "git"
remote = "git@github.com:voluma-bio/docs.git"
path = "strategy"

# -- Hooks -------------------------------------------------------------------
# Auto-sync work to private docs repo
[[hooks]]
builtin = "git-autosync"
remote = "git@github.com:haowjy/meridian-cli-docs.git"

# Auto-sync KB to public KB repo
[[hooks]]
builtin = "git-autosync"
remote = "git@github.com:haowjy/meridian-cli-kb.git"

# -- Workspace roots ---------------------------------------------------------
# Use parent directory to avoid Claude Code skill leakage from individual repos.
# See docs/configuration.md "Claude Code Skill Leakage" for details.
[workspace.sibling-repos]
path = ".."
