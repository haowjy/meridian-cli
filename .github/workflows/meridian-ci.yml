name: meridian-channel-ci

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  pr-changelog-note:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Warn when release label is missing
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          has_release_label=false
          while IFS= read -r label; do
            if [[ "$label" == release:* ]]; then
              has_release_label=true
              break
            fi
          done < <(jq -r '.[]' <<<"${LABELS_JSON}")

          if [[ "${has_release_label}" == true ]]; then
            echo "::notice::Release label detected on this PR."
          else
            echo "::warning::No release:* label set. Merge to main will skip auto-release."
          fi

      - name: Note CHANGELOG.md coverage
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" -- CHANGELOG.md | grep -q '^CHANGELOG\.md$'; then
            echo "::notice::CHANGELOG.md is updated in this PR."
          else
            echo "::notice::CHANGELOG.md is unchanged in this PR."
          fi

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.18"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run --extra dev ruff check .

      - name: Typecheck
        run: uv run --extra dev python -m pyright

  fast-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.18"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pnpm
        run: corepack enable

      - name: Build Pi extensions
        run: cd src/meridian/pi_runtime && pnpm install --frozen-lockfile && pnpm run build:extensions

      - name: Run fast gate
        run: uv run --extra dev pytest -n auto -m "not slow"

  full-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.18"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pnpm
        run: corepack enable

      - name: Build Pi extensions
        run: cd src/meridian/pi_runtime && pnpm install --frozen-lockfile && pnpm run build:extensions

      - name: Run full gate
        run: scripts/preflight.sh full

  compat:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.18"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pnpm
        run: corepack enable

      - name: Build Pi extensions
        run: cd src/meridian/pi_runtime && pnpm install --frozen-lockfile && pnpm run build:extensions

      - name: Run compatibility gate
        run: uv run --extra dev pytest -n auto -m "not windows_only"

  windows-gate:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.18"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pnpm
        run: corepack enable

      - name: Build Pi extensions
        run: cd src/meridian/pi_runtime && pnpm install --frozen-lockfile && pnpm run build:extensions

      - name: Run Windows gate
        # Windows xdist worker startup can hang before pytest emits output; run the same
        # non-slow platform gate serially so Windows coverage stays authoritative.
        run: uv run --extra dev pytest -n 0 -m "not slow"
