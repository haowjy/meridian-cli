name: PR body

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]

concurrency:
  group: pr-body-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # A minor or major label on a PR to main cuts its own release on merge, so it belongs only
  # on a release branch's PR. Runs on drafts too, so the mistake shows before review.
  release-branch:
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Minor and major releases come from a release branch
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ "${HEAD_REF}" == release/* ]]; then
            exit 0
          fi
          if jq -e 'any(.[]; . == "release:minor" or . == "release:major")' <<<"${LABELS_JSON}" > /dev/null; then
            echo "::error::release:minor and release:major cut their own release on merge, so only a release branch's PR to main carries them. Point this PR at the open release/vX.Y.0 branch (create it from main if none is open) and drop the label: https://github.com/haowjy/meridian-cli/blob/main/docs/releasing.md#minor-and-major-releases-collect-on-a-release-branch"
            exit 1
          fi

  changelog-section:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The gate reads CHANGELOG.md as the base branch has it, which needs
          # history deeper than the merge commit.
          fetch-depth: 0

      - name: Check the changelog section
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          # pull_request.base.sha is the base as of the PR's last head push, and
          # an edited event keeps it. Once the base branch moves (a release
          # commit), comparing the merge commit against it blames the PR for
          # the base's own CHANGELOG changes. Compare against the base tip.
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          body_file="${RUNNER_TEMP}/pr-body.md"
          base_file="${RUNNER_TEMP}/base-changelog.md"
          printf '%s' "${PR_BODY}" > "${body_file}"
          git show "origin/${BASE_REF}:CHANGELOG.md" > "${base_file}"
          python3 scripts/changelog-notes.py validate \
            --notes-file "${body_file}" \
            --changelog CHANGELOG.md \
            --base-changelog "${base_file}"
