name: PR body

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-body-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changelog-section:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The gate reads CHANGELOG.md as the base branch has it, which needs
          # history deeper than the merge commit.
          fetch-depth: 0

      - name: Check the changelog section
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          # pull_request.base.sha is the base as of the PR's last head push, and
          # an edited event keeps it. Once the base branch moves (a release
          # commit), comparing the merge commit against it blames the PR for
          # the base's own CHANGELOG changes. Compare against the base tip.
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          body_file="${RUNNER_TEMP}/pr-body.md"
          base_file="${RUNNER_TEMP}/base-changelog.md"
          printf '%s' "${PR_BODY}" > "${body_file}"
          git show "origin/${BASE_REF}:CHANGELOG.md" > "${base_file}"
          python3 scripts/changelog-notes.py validate \
            --notes-file "${body_file}" \
            --changelog CHANGELOG.md \
            --base-changelog "${base_file}"
