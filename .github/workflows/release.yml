name: Release

on:
  push:
    tags: ["v*"]

jobs:
  verify-provenance:
    name: Verify release provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Verify tag provenance
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          INIT_VERSION=$(grep -oP '(?<=__version__ = ")[^"]+' src/meridian/__init__.py)

          if [[ "$TAG_VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-rc\.([0-9]+)$ ]]; then
            PYPI_VERSION="${BASH_REMATCH[1]}rc${BASH_REMATCH[2]}"
            RELEASE_KIND="rc"
          elif [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            PYPI_VERSION="$TAG_VERSION"
            RELEASE_KIND="stable"
          else
            echo "::error::Tag version ($TAG_VERSION) must be stable X.Y.Z or RC X.Y.Z-rc.N"
            exit 1
          fi

          if [[ "$PYPI_VERSION" != "$INIT_VERSION" ]]; then
            echo "::error::Expected src/meridian/__init__.py version $PYPI_VERSION for $RELEASE_KIND tag $TAG_VERSION, got $INIT_VERSION"
            exit 1
          fi

          escaped_tag_version="$(sed 's/[][\\.^$*+?(){}|/-]/\\&/g' <<<"${TAG_VERSION}")"
          if ! grep -qE "^## \\[${escaped_tag_version}\\] - " CHANGELOG.md; then
            echo "::error::CHANGELOG.md missing release section for ${TAG_VERSION} (expected '## [${TAG_VERSION}] - YYYY-MM-DD')"
            exit 1
          fi

          DEFAULT_BRANCH=$(git remote show origin | grep 'HEAD branch' | awk '{print $NF}')
          RELEASE_SHA="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$RELEASE_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::Tagged commit is not reachable from $DEFAULT_BRANCH"
            exit 1
          fi

          COMMIT_MSG=$(git log -1 --format=%s "$RELEASE_SHA")
          if [[ "$COMMIT_MSG" != "release: v$TAG_VERSION" ]]; then
            echo "::error::Release commit message doesn't match expected format: release: v$TAG_VERSION"
            exit 1
          fi

          echo "Provenance verified for v$TAG_VERSION ($RELEASE_KIND)"

  sync-wheels:
    name: Build meridian-sync wheel (${{ matrix.target }})
    needs: [verify-provenance]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      # crates.io downloads intermittently fail with HTTP/2 framing errors; these are
      # CARGO_*-prefixed, so maturin-action forwards them into the manylinux container.
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"
    strategy:
      # A leg fails on a flaky runner or network, not on broken code (full preflight gates
      # the tag), so let the others finish: `gh run rerun --failed` then re-runs one leg
      # instead of several cancelled ones.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: auto
          working-directory: crates/meridian-sync
          args: --release --out dist

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.9"

      - name: Smoke-test the wheel
        run: uv run --isolated --no-project --with crates/meridian-sync/dist/*.whl meridian-sync version

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: sync-wheel-${{ matrix.target }}
          path: crates/meridian-sync/dist/*.whl

  sync-sdist:
    name: Build meridian-sync sdist
    needs: [verify-provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          working-directory: crates/meridian-sync
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: sync-sdist
          path: crates/meridian-sync/dist/*.tar.gz

  build:
    name: Build distributions
    needs: [verify-provenance, sync-wheels, sync-sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.9"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build Pi extensions
        run: |
          corepack enable
          cd src/meridian/pi_runtime && pnpm install --frozen-lockfile && pnpm run build:extensions

      - name: Download meridian-sync distributions
        uses: actions/download-artifact@v8
        with:
          pattern: sync-*
          path: dist-sync
          merge-multiple: true

      - name: Build distributions
        run: uv build --no-sources

      - name: Verify Pi extensions in distributions
        run: uv run --no-sync python scripts/verify-pi-extension-artifacts.py dist

      # maturin's wheels and hatch's are checked separately: each directory needs a wheel and
      # an sdist.
      - name: Verify release metadata
        run: |
          uv run --no-sync python scripts/verify-release-metadata.py dist-sync
          uv run --no-sync python scripts/verify-release-metadata.py dist

      # meridian-sync is not on PyPI until the publish job, so the exact pin resolves from
      # the wheel built above.
      - name: Validate wheel artifact
        run: |
          uv run --isolated --no-project --find-links dist-sync --with dist/*.whl meridian --version
          uv run --isolated --no-project --find-links dist-sync --with dist/*.whl meridian doctor
          uv run --isolated --no-project --find-links dist-sync --with dist/*.whl meridian-sync version

      - name: Validate sdist artifact
        run: |
          uv run --isolated --no-project --find-links dist-sync --with dist/*.tar.gz meridian --version
          uv run --isolated --no-project --find-links dist-sync --with dist/*.tar.gz meridian doctor
          uv run --isolated --no-project --find-links dist-sync --with dist/*.tar.gz meridian-sync version

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

      - name: Upload meridian-sync distributions
        uses: actions/upload-artifact@v7
        with:
          name: meridian-sync-distributions
          path: dist-sync/

  pypi-publish:
    name: Publish PyPI
    needs: [build, verify-provenance]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - uses: actions/download-artifact@v8
        with:
          name: meridian-sync-distributions
          path: dist-sync/

      # meridian-cli pins meridian-sync exactly, so the pin must exist on PyPI first.
      - name: Publish meridian-sync to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-sync
          skip-existing: true

      - name: Publish meridian-cli to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  github-release:
    name: Publish GitHub Release
    needs: [pypi-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"

          notes_file="${RUNNER_TEMP}/release-notes.md"
          python3 scripts/changelog-notes.py extract \
            --version "${TAG_VERSION}" > "${notes_file}"

          release_args=(--title "${RELEASE_TAG}" --notes-file "${notes_file}")
          if [[ "${TAG_VERSION}" =~ -rc\.[0-9]+$ ]]; then
            release_args+=(--prerelease)
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" "${release_args[@]}"
          else
            gh release create "${RELEASE_TAG}" "${release_args[@]}" --verify-tag
          fi
