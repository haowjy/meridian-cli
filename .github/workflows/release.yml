name: Release

on:
  push:
    tags: ["v*"]

jobs:
  verify-provenance:
    name: Verify release provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Verify tag provenance
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          INIT_VERSION=$(grep -oP '(?<=__version__ = ")[^"]+' src/meridian/__init__.py)

          if [[ "$TAG_VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-rc\.([0-9]+)$ ]]; then
            PYPI_VERSION="${BASH_REMATCH[1]}rc${BASH_REMATCH[2]}"
            RELEASE_KIND="rc"
          elif [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            PYPI_VERSION="$TAG_VERSION"
            RELEASE_KIND="stable"
          else
            echo "::error::Tag version ($TAG_VERSION) must be stable X.Y.Z or RC X.Y.Z-rc.N"
            exit 1
          fi

          if [[ "$PYPI_VERSION" != "$INIT_VERSION" ]]; then
            echo "::error::Expected src/meridian/__init__.py version $PYPI_VERSION for $RELEASE_KIND tag $TAG_VERSION, got $INIT_VERSION"
            exit 1
          fi

          escaped_tag_version="$(sed 's/[][\\.^$*+?(){}|/-]/\\&/g' <<<"${TAG_VERSION}")"
          if ! grep -qE "^## \\[${escaped_tag_version}\\] - " CHANGELOG.md; then
            echo "::error::CHANGELOG.md missing release section for ${TAG_VERSION} (expected '## [${TAG_VERSION}] - YYYY-MM-DD')"
            exit 1
          fi

          DEFAULT_BRANCH=$(git remote show origin | grep 'HEAD branch' | awk '{print $NF}')
          RELEASE_SHA="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$RELEASE_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::Tagged commit is not reachable from $DEFAULT_BRANCH"
            exit 1
          fi

          COMMIT_MSG=$(git log -1 --format=%s "$RELEASE_SHA")
          if [[ "$COMMIT_MSG" != "release: v$TAG_VERSION" ]]; then
            echo "::error::Release commit message doesn't match expected format: release: v$TAG_VERSION"
            exit 1
          fi

          echo "Provenance verified for v$TAG_VERSION ($RELEASE_KIND)"

  build:
    name: Build distributions
    needs: [verify-provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.18"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build distributions
        run: uv build --no-sources

      - name: Validate wheel artifact
        run: |
          uv run --isolated --no-project --with dist/*.whl meridian --version
          uv run --isolated --no-project --with dist/*.whl meridian doctor

      - name: Validate sdist artifact
        run: |
          uv run --isolated --no-project --with dist/*.tar.gz meridian --version
          uv run --isolated --no-project --with dist/*.tar.gz meridian doctor

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  pypi-publish:
    name: Publish PyPI
    needs: [build, verify-provenance]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
