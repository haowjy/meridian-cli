name: publish-pypi

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

jobs:
  verify-provenance:
    name: Verify release provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Verify tag provenance
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          PY_VERSION=$(grep -oP '(?<=__version__ = ")[^"]+' src/meridian/__init__.py)

          if [[ "$TAG_VERSION" != "$PY_VERSION" ]]; then
            echo "::error::Tag version ($TAG_VERSION) != __init__.py ($PY_VERSION)"
            exit 1
          fi

          DEFAULT_BRANCH=$(git remote show origin | grep 'HEAD branch' | awk '{print $NF}')
          RELEASE_SHA="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$RELEASE_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::Tagged commit is not reachable from $DEFAULT_BRANCH"
            exit 1
          fi

          COMMIT_MSG=$(git log -1 --format=%s "$RELEASE_SHA")
          if [[ "$TAG_VERSION" == *-rc* ]]; then
            [[ "$COMMIT_MSG" == "Release candidate $TAG_VERSION" ]] || \
              echo "::warning::RC commit message doesn't match expected format"
          else
            if [[ "$COMMIT_MSG" != "Release $TAG_VERSION" ]]; then
              echo "::error::Commit message doesn't match: expected 'Release $TAG_VERSION', got '$COMMIT_MSG'"
              exit 1
            fi
          fi

          echo "Provenance verified for v$TAG_VERSION"

  build:
    needs: [verify-provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build distributions
        run: uv build --no-sources

      - name: Validate wheel artifact
        run: |
          uv run --isolated --no-project --with dist/*.whl meridian --version
          uv run --isolated --no-project --with dist/*.whl meridian doctor

      - name: Validate sdist artifact
        run: |
          uv run --isolated --no-project --with dist/*.tar.gz meridian --version
          uv run --isolated --no-project --with dist/*.tar.gz meridian doctor

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: pypi

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
