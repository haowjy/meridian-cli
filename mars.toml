[dependencies.meridian-dev-workflow]
url = "https://github.com/haowjy/meridian-dev-workflow"

[dependencies.meridian-prompter]
url = "https://github.com/meridian-flow/meridian-prompter"

[models.composer]
harness = "cursor"
model = "composer-2.5"
provider = "cursor"
description = "Cursor's native coding model. Fast, strong tool use."

[settings]
targets = [
    ".pi",
    ".claude",
    ".opencode",
    ".codex",
]
models_cache_ttl_hours = 24
